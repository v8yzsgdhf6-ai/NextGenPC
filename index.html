<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1114;--bg2:#171a1f;--line:#2a2f37;--tx:#f2f4f6;--mu:#8d96a3;--g:#39ff88;--gd:#0c2a1b;--w:#ffc24a;--r:#ff5a5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f4f6f8;--bg2:#fff;--line:#d8dde3;--tx:#14171b;--mu:#5c6672;--g:#0a9d4d;--gd:#dcf5e7;--w:#b97800;--r:#c9302f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:"Chakra Petch",system-ui,sans-serif;margin:0;line-height:1.15}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.logo{font-size:22px;font-weight:700;letter-spacing:.5px}.logo b{color:var(--g)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}nav a{padding:6px 12px;border-radius:8px;color:var(--mu);white-space:nowrap;font-size:15px}
nav a.on{color:var(--tx);background:var(--bg2);box-shadow:inset 0 -2px var(--g)}
main{max-width:1100px;margin:auto;padding:24px 16px 80px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg2);color:var(--tx);padding:10px 18px;border-radius:10px;cursor:pointer;display:inline-block}
.btn.p{background:var(--g);color:#06140c;border-color:var(--g)}.btn:hover{border-color:var(--g)}.btn.s{padding:6px 12px;font-size:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.hero{display:grid;gap:28px;grid-template-columns:1.1fr .9fr;align-items:center;padding:28px 0 36px}
.hero h1{font-size:clamp(34px,6vw,56px)}.hero p{color:var(--mu);font-size:18px;max-width:34em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pc{border:1px solid var(--line);border-radius:18px;padding:20px;background:linear-gradient(160deg,var(--bg2),var(--bg));box-shadow:0 0 40px -12px var(--g)}
.pc svg{width:100%;height:auto;display:block}
h2{font-size:26px;margin:36px 0 14px}h3{font-size:18px}
.mu{color:var(--mu);font-size:14px}.pr{font-weight:600;color:var(--g)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mu)}
.demo{background:var(--gd);border:1px solid var(--g);color:var(--g);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 16px}
input,select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input[type=range]{width:100%;padding:0;accent-color:var(--g)}
.chip{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--bg2);font-size:14px}
.chip.on{border-color:var(--g);background:var(--gd);color:var(--g)}
.lay{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.side{position:sticky;top:76px}
.st{display:flex;gap:8px;font-size:14px;padding:5px 0}.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.ok .dot{background:var(--g)}.warn .dot{background:var(--w)}.err .dot{background:var(--r)}.na .dot{background:var(--mu)}
.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
.li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g);color:#06140c;padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
@media(max-width:800px){.hero,.lay{grid-template-columns:1fr}.side{position:static}.bar{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body{background:radial-gradient(900px 420px at 85% -8%,rgba(57,255,136,.13),transparent 70%),var(--bg)}
.card{transition:border-color .2s,transform .2s}.card:hover{border-color:var(--g);transform:translateY(-2px)}
.pc{animation:gl 4s ease-in-out infinite}@keyframes gl{50%{box-shadow:0 0 56px -6px var(--g)}}
.logo{text-shadow:0 0 18px rgba(57,255,136,.35)}.btn.p:hover{box-shadow:0 0 18px -2px var(--g)}
.cons{border:1px solid var(--g);border-radius:12px;padding:12px;margin-top:14px}.cons h4{margin:12px 0 2px;font:700 15px 'Chakra Petch',system-ui}
footer{max-width:1100px;margin:auto;padding:0 16px 32px;color:var(--mu);font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}.best{color:var(--g);font-weight:600}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
.fan{transform-box:fill-box;transform-origin:center;animation:sp 5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#app{animation:fi .3s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}summary{cursor:pointer;font-weight:600}details.card{margin-bottom:10px}details p{margin:8px 0 0}
@media(prefers-reduced-motion:reduce){.fan,.pc,#app{animation:none!important}}
.rgb{stroke:#39ff88;animation:rgb 7s linear infinite}@keyframes rgb{33%{stroke:#4dd0e1}66%{stroke:#c084fc}}
.fan.f2{animation-duration:3s}.fan.f3{animation-duration:7s;animation-direction:reverse}.gl{animation:rgb 7s linear infinite,pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}
.pc svg{animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(57,255,136,.25))}@keyframes fl{50%{transform:translateY(-8px)}}
.pc{background:radial-gradient(circle at 50% 40%,rgba(57,255,136,.14),transparent 65%),linear-gradient(160deg,var(--bg2),var(--bg))}
.hero h1{background:linear-gradient(95deg,var(--tx) 40%,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:0 0 8px}.stats div{border-left:2px solid var(--g);padding:2px 12px}.stats b{display:block;font:700 26px 'Chakra Petch',system-ui}
@media(prefers-reduced-motion:reduce){.rgb,.gl,.pc svg{animation:none!important}}
.stt{stroke:var(--mu)}.mbar{display:none}
@media(max-width:800px){.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:1px solid var(--line);justify-content:space-between;align-items:center;z-index:8}}
@media print{header,footer,.mbar,.lay>div:first-child,button,select,.toast,.chip{display:none!important}.lay{grid-template-columns:1fr}body{background:#fff;color:#000}.card{border-color:#999;box-shadow:none}.pr{color:#000}}
</style></head><body>

<div class="pc"><svg viewBox="0 0 360 300" fill="none" stroke-width="2"><rect x="70" y="8" width="220" height="284" rx="14" stroke="#2a2f37" fill="#0b0d10"/><rect x="82" y="20" width="196" height="214" rx="8" class="rgb" opacity=".45"/>
<g class="fan rgb"><circle cx="150" cy="72" r="28"/><path d="M150 44v56M122 72h56M130 52l40 40M170 52l-40 40"/></g><circle cx="150" cy="72" r="6" class="rgb"/>
<rect x="212" y="42" width="7" height="54" rx="2" class="rgb gl"/><rect x="224" y="42" width="7" height="54" rx="2" class="rgb gl" style="animation-delay:.4s"/><rect x="236" y="42" width="7" height="54" rx="2" class="rgb gl" style="animation-delay:.8s"/><rect x="248" y="42" width="7" height="54" rx="2" class="rgb gl" style="animation-delay:1.2s"/>
<rect x="94" y="128" width="172" height="44" rx="6" class="rgb"/><g class="fan f2 rgb"><circle cx="128" cy="150" r="15"/><path d="M128 135v30M113 150h30"/></g><g class="fan f2 rgb"><circle cx="180" cy="150" r="15"/><path d="M180 135v30M165 150h30"/></g><g class="fan f2 rgb"><circle cx="232" cy="150" r="15"/><path d="M232 135v30M217 150h30"/></g>
<rect x="82" y="196" width="196" height="30" rx="4" stroke="#2a2f37"/><path d="M96 211h60" stroke="#2a2f37"/>
<g class="fan f3 rgb"><circle cx="130" cy="264" r="17"/><path d="M130 247v34M113 264h34"/></g><g class="fan f3 rgb"><circle cx="230" cy="264" r="17"/><path d="M230 247v34M213 264h34"/></g></svg></div></section>
<div class="stats"><div><b>${P.length}+</b><span class="mu">комплектующих</span></div><div><b>${Object.keys(CURS).length}</b><span class="mu">валют</span></div><div><b>RTX 50</b><span class="mu">и Ryzen 9000</span></div><div><b>8</b><span class="mu">проверок совместимости</span></div></div>
<div class="grid">${[['Миллионы сочетаний','Алгоритм перебирает сборки демо-каталога под бюджет, бренд и задачи'],['Проверка совместимости','Сокет, память, габариты, питание — по характеристикам'],['Расчёт стоимости','Цена пересчитывается при каждом изменении'],['Мониторы и девайсы','Советуем монитор, мышь и клавиатуру под мощность видеокарты']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join('')}</div>
<h2>Популярные сборки</h2>${DEMO}<div class="grid">${BUILDS.slice(0,3).map(buildCard).join('')}</div>
<h2>Как это работает</h2><div class="grid"><div class="card"><h3>1. Бюджет и задачи</h3><p class="mu">Укажите сумму и для чего нужен компьютер.</p></div><div class="card"><h3>2. Подбор и проверка</h3><p class="mu">Получите сборку с объяснением выбора и статусом совместимости.</p></div><div class="card"><h3>3. Правки</h3><p class="mu">Откройте сборку в конфигураторе и замените любую деталь.</p></div></div>
<h2>Быстрый старт</h2><p class="mu">Нажмите на бюджет — сразу получите сборку.</p><div class="row" style="margin-top:10px">${[150,200,300,500,1000,3000].map(x=>`<span class="chip" data-q="${x*1000}">до ${fmt(x*1000)}</span>`).join('')}</div>
<h2>Частые вопросы</h2><details class="card"><summary>Что такое индекс производительности?</summary><p class="mu">Условная шкала сайта: RTX 4060 принята за 100, остальное сравнивается с ней. Это не FPS, а ориентир по классу.</p></details>
<details class="card"><summary>AMD или Intel?</summary><p class="mu">Для игр хороши оба. Смотрите на цену всей сборки и на возможность апгрейда. Если не уверены, выберите «без разницы» — подберём лучший вариант по цене.</p></details>
<details class="card"><summary>Нужна ли отдельная видеокарта?</summary><p class="mu">Для современных игр — да. Для учёбы, офиса и лёгких игр хватит процессора со встроенной графикой.</p></details>
<details class="card"><summary>Почему 8 ГБ памяти — мало?</summary><p class="mu">Игры, браузер и система вместе быстро занимают 8 ГБ. Комфортный минимум сегодня — 16 ГБ.</p></details>`},
'/picker'(){return`${DEMO}<h1>Подбор ПК</h1><div class="card" style="margin:16px 0"><h3>Бюджет</h3><div class="row" id="bp" style="margin:10px 0">${[200,300,500,1000,3000,10000].map(x=>`<span class="chip" data-b="${Math.round(x*1000*CUR.r)}">до ${fmt(x*1000)}</span>`).join('')}</div>
<input type="range" id="rg" min="0" max="1000" step="1" value="${toS(500000)}"><div class="row" style="margin-top:8px"><input type="number" id="bn" value="${Math.round(500000*CUR.r)}" inputmode="numeric"><span class="mu">${CUR.s} (свой бюджет)</span></div>
<h3 style="margin-top:16px">Для чего нужен компьютер (можно несколько)</h3><div class="row" id="us" style="margin-top:10px">${Object.entries(PU).map(([k,v])=>`<span class="chip ${k==='comp'?'on':''}" data-u="${k}">${v}</span>`).join('')}</div>
<h3 style="margin-top:16px">Предпочтения</h3><div class="row" style="margin-top:8px"><select id="pc"><option value="">Процессор: без разницы</option><option>AMD</option><option>Intel</option></select><select id="pg"><option value="">Видеокарта: без разницы</option><option>NVIDIA</option><option>AMD</option></select></div><p class="mu">Не разбираетесь? Оставьте «без разницы».</p><h3 style="margin-top:16px">Что подбираем</h3><select id="sc" style="margin-top:8px"><option value="pc">Только системный блок</option><option value="kit">Блок + монитор и девайсы в бюджет</option></select>
<div class="row" style="margin-top:16px"><button class="btn p" id="go">Подобрать</button></div><p class="mu">Подбор среди демо-каталога; без игр, монитора и других необязательных параметров.</p></div><div id="res"></div>`},
'/config'(){return`${DEMO}<h1>Конфигуратор</h1><div class="lay" style="margin-top:16px"><div>${Object.entries(CAT).map(([k,v])=>`<h2 style="margin:20px 0 10px">${v}</h2><div class="grid">${P.filter(x=>x.c===k).map(x=>partCard(x,`<button class="btn s ${B[k]===x.id?'':'p'}" data-pick="${x.id}">${B[k]===x.id?'Выбрано ✓':'Выбрать'}</button>`,conf(x))).join('')}</div>`).join('')}</div><div id="sm">${summary(B)}</div></div><div class="mbar"><span><b>${fmt(total(B))}</b> · ${Object.keys(B).length}/8 деталей</span><button class="btn p s" data-scroll>Показать сборку</button></div>`},
'/catalog'(){return`${DEMO}<h1>Каталог комплектующих</h1><div class="row" style="margin:16px 0"><input id="q" placeholder="Поиск по названию"><select id="cc"><option value="">Все категории</option>${Object.entries(CATL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="cb2"><option value="">Все производители</option>${[...new Set(P.map(x=>x.b))].sort().map(x=>`<option>${x}</option>`).join('')}</select><input id="mx" type="number" placeholder="Цена до (в вашей валюте)" inputmode="numeric"><select id="so"><option value="">Без сортировки</option><option value="a">Цена: по возрастанию</option><option value="d">Цена: по убыванию</option><option value="f">Производительность (если есть)</option></select></div><div class="grid" id="cl"></div>`},
'/builds'(){return`${DEMO}<h1>Готовые сборки</h1><div class="grid" style="margin-top:16px">${BUILDS.map(buildCard).join('')}</div>`}};
function buildCard(x){const b=Object.fromEntries(x.ids.map(i=>[G[i].c,i])),i=BUILDS.indexOf(x),w=worst(compat(b));return`<div class="card"><h3>${x.n}</h3><p class="mu">${x.use}</p>${x.ids.map(i=>`<div class="li"><span>${G[i].n}</span></div>`).join('')}<p><span class="pr">${fmt(total(b))}</span> <span class="tag">совместимость: ${w==='ok'?'ок':w==='warn'?'есть замечания':'есть проблемы'}</span></p><p class="mu">+ ${x.pro}<br>− ${x.con}</p><button class="btn p s" data-open="${i}">Открыть в конфигураторе</button></div>`}
function drawCat(){const q=$('#q').value.toLowerCase(),c=$('#cc').value,br=$('#cb2').value,mx=+$('#mx').value,so=$('#so').value;
let l=P.filter(x=>(!q||x.n.toLowerCase().includes(q))&&(!c||x.c===c)&&(!br||x.b===br)&&(!mx||x.p*CUR.r<=mx));
if(so==='a')l.sort((a,b)=>a.p-b.p);if(so==='d')l.sort((a,b)=>b.p-a.p);if(so==='f')l=l.filter(x=>x.f).sort((a,b)=>b.f-a.f);
$('#cl').innerHTML=l.length?l.map(x=>partCard(x,`<button class="btn s p" data-add="${x.id}">В конфигуратор</button>`)).join(''):'<p class="mu">Ничего не найдено. Измените фильтры или поиск.</p>'}
let RS=null;
function result(){const kit=$('#sc').value==='kit',bud=Math.round(+$('#bn').value/CUR.r),us=[...document.querySelectorAll('[data-u].on')].map(x=>x.dataset.u),pf={cpu:$('#pc').value,gpu:$('#pg').value};
if(!(bud>=50000&&bud<=MAXK))return $('#res').innerHTML=`<div class="card"><b>Укажите бюджет от ${fmt(50000)} до ${fmt(MAXK)}.</b></div>`;
if(!us.length)return $('#res').innerHTML='<div class="card"><b>Выберите хотя бы одну задачу.</b></div>';
let r=pick(kit?Math.round(bud*.78):bud,us,pf);if(kit&&!r.list.length)r=pick(bud,us,pf);
if(!r.list.length)return $('#res').innerHTML=`<div class="card"><h3>На этот бюджет полноценной сборки не нашлось</h3><p>${r.min<1e12?`С вашими предпочтениями минимальная сборка в демо-каталоге стоит ${fmt(r.min)}.`:'С такими предпочтениями сборка невозможна.'} Увеличьте бюджет, смените предпочтения или уменьшите требования.</p></div>`;
RS={r,us,bud,kit};if(us.includes('comp'))unlock('fps');showVar(r.list[0],'Вариант 1')}
function showVar(v,lab){const{r,us,bud,kit}=RS,b=v.b,w=why(b,r);if(v.t<r.list[0].t)unlock('eco');
$('#res').innerHTML=`<div class="lay"><div class="card"><h3>${lab}</h3><p class="mu">Нашёл ${r.count.toLocaleString('ru-RU')} совместимых сборок в вашем бюджете. Задачи: ${us.map(u=>PU[u]).join(', ')}.</p><div class="row" style="margin:8px 0">${r.list.map((x,i)=>`<span class="chip ${lab==='Вариант '+(i+1)?'on':''}" data-var="${i}">Вариант ${i+1}</span>`).join('')}<span class="chip ${lab==='Сюрприз'?'on':''}" data-var="s">🎲 Сюрприз</span></div>${Object.keys(CAT).map(k=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row" style="justify-content:space-between"><b>${G[b[k]].n}</b><span class="pr">${fmt(G[b[k]].p)}</span></div><div class="mu">${w[k]}</div></div>`).join('')}${bar(b)}${consult(b,us)}${advice(b,us,bud-v.t,kit,bud)}<div class="row" style="margin-top:12px"><button class="btn p" id="oc">Открыть в конфигураторе</button><button class="btn" id="cp2">Копировать</button><button class="btn" id="sv2">Сохранить</button></div></div><div class="card side"><h3>Итого ${fmt(v.t)}</h3><p class="mu">Осталось ${fmt(bud-v.t)}</p>${bud-v.t>v.t?'<p class="mu">Бюджет заметно больше сборки: остаток можно отдать на монитор, периферию и запас на апгрейд.</p>':''}<h3>Совместимость</h3>${stH(compat(b))}</div></div>`;
$('#oc').onclick=()=>{B={...b};save();location.hash='#/config'};$('#cp2').onclick=()=>copyT(btxt(lab+' — '+fmt(v.t),b));$('#sv2').onclick=()=>{S.push({n:lab+' ('+fmt(v.t)+')',b:{...b}});saveS();unlock('first');toast('Сохранено в «Мои сборки»')}}
function pickVar(v){if(!RS)return;if(v==='s'){const t=RS.r.top;showVar(t[Math.random()*t.length|0],'Сюрприз')}else showVar(RS.r.list[+v],'Вариант '+(+v+1))}
function drawCmp(){$('#cp').innerHTML=P.filter(x=>x.c===CM.c).map(x=>`<div class="card ${CM.ids.includes(x.id)?'sel':''}"><b>${x.n}</b><p class="mu">${x.sp}</p><div class="row" style="justify-content:space-between"><span class="pr">${fmt(x.p)}</span><button class="btn s ${CM.ids.includes(x.id)?'':'p'}" data-cmp="${x.id}">${CM.ids.includes(x.id)?'Убрать':'Сравнить'}</button></div></div>`).join('');
const l=CM.ids.map(i=>G[i]);if(l.length<2)return $('#ct').innerHTML='<p class="mu">Выберите минимум две детали.</p>';
const mn=(f)=>Math.min(...l.map(f)),mx=(f)=>Math.max(...l.map(f)),row=(n,f,best)=>`<tr><td class="mu">${n}</td>${l.map(x=>`<td class="${best&&f(x)===best?'best':''}">${f(x)===undefined?'—':f(x)}</td>`).join('')}</tr>`;
const hf=l.every(x=>x.f),val=x=>x.p?+(x.f/(x.p/10000)).toFixed(1):undefined;
$('#ct').innerHTML=`<div class="card tw"><table><tr><th></th>${l.map(x=>`<th>${x.n}</th>`).join('')}</tr>${row('Цена, '+CUR.s,x=>Math.round(x.p*CUR.r),Math.round(mn(x=>x.p)*CUR.r))}${hf?row('Индекс производительности',x=>x.f,mx(x=>x.f)):''}${hf&&l.every(x=>x.p)?row('Индекс на '+fmt(10000),val,mx(val)):''}${l.every(x=>x.tdp!==undefined)?row('Тепловыделение, Вт',x=>x.tdp,mn(x=>x.tdp)):''}${row('Характеристики',x=>x.sp)}</table><p class="mu">Зелёным выделено лучшее значение в строке. Универсально лучшей детали нет: выбирайте по задачам и бюджету.</p></div>`}
function drawGames(){const i=+$('#gb').value,b=i<0?B:Object.fromEntries(BUILDS[i].ids.map(x=>[G[x].c,x])),k=+$('#gr').value,c=G[b.cpu],g=G[b.gpu];
$('#gt').innerHTML=`<div class="card"><p class="mu">${c.n} + ${g.n}</p><table>${GAMES.map(x=>{const m=Math.min(c.f/x[2],g.f/(x[1]*k)),v=m>=1.8?['ok','Высокие настройки']:m>=1.2?['ok','Средние–высокие']:m>=1?['warn','Низкие–средние']:['err','Не рекомендуется'];return`<tr><td>${x[0]}</td><td><div class="st ${v[0]}" style="padding:0"><span class="dot"></span><span>${v[1]}</span></div></td></tr>`}).join('')}</table></div>`}
function route(){const an=arguments[0]&&arguments[0].type==='hashchange';const h=(location.hash.slice(1)||'/'),k=V[h]?h:'/';$('#nav').innerHTML=NAV.map(x=>`<a href="#${x[0]}" class="${x[0]===k?'on':''}">${x[1]}</a>`).join('');$('#app').innerHTML=V[k]();scrollTo(0,0);if(an){const a=$('#app');a.style.animation='none';a.offsetWidth;a.style.animation=''}
if(k==='/catalog'){['q','cc','cb2','mx','so'].forEach(i=>$('#'+i).oninput=drawCat);drawCat()}
if(k==='/config'||k==='/visual')chk();if(k==='/psu'){$('#pcpu').onchange=$('#pgpu').onchange=drawPsu;drawPsu()}if(k==='/saved')$('#app').insertAdjacentHTML('beforeend',achHtml());
if(k==='/compare'){$('#cq').onchange=e=>{CM={c:e.target.value,ids:[]};drawCmp()};drawCmp()}
if(k==='/games'){$('#gb').onchange=$('#gr').onchange=drawGames;drawGames()}
if(k==='/picker'){const rg=$('#rg'),bn=$('#bn');rg.oninput=()=>{bn.value=Math.round(fromS(+rg.value)*CUR.r)};bn.oninput=()=>{rg.value=toS(bn.value/CUR.r)};
document.querySelectorAll('[data-b]').forEach(c=>c.onclick=()=>{bn.value=c.dataset.b;rg.value=toS(c.dataset.b/CUR.r)});
document.querySelectorAll('[data-u]').forEach(c=>c.onclick=()=>c.classList.toggle('on'));$('#go').onclick=()=>{$('#res').innerHTML='<div class="card"><p class="mu">Перебираю сочетания…</p></div>';setTimeout(result,30)};if(PRE){bn.value=Math.round(PRE*CUR.r);rg.value=toS(PRE);PRE=0;result()}}}
document.addEventListener('click',e=>{const q=e.target.closest('[data-cmp],[data-save],[data-load],[data-del],[data-copy],[data-var],[data-auto],[data-q],[data-share],[data-pdf],[data-vz],[data-scroll]');if(q){const d=q.dataset;if(d.share!==undefined){shareB(B,'Моя сборка NextGen PC')}else if(d.pdf!==undefined){try{window.print()}catch(x){toast('Печать недоступна — скопируйте список')}}else if(d.vz!==undefined){vz(d.vz)}else if(d.scroll!==undefined){$('#sm').scrollIntoView({behavior:'smooth'})}else if(d.auto!==undefined){auto();route2()}else if(d.q!==undefined){PRE=+d.q;location.hash='#/picker'}else if(d.var!==undefined){pickVar(d.var)}else if(d.cmp){const a=CM.ids,i=a.indexOf(d.cmp);if(i>=0)a.splice(i,1);else if(a.length<3)a.push(d.cmp);else toast('Максимум 3 детали');drawCmp()}
else if(d.save!==undefined){const n=($('#nm').value||'').trim()||'Сборка '+(S.length+1);S.push({n,b:{...B}});saveS();unlock('first');toast('Сохранено: '+n)}
else if(d.load){B={...S[d.load].b};save();location.hash='#/config'}
else if(d.del){S.splice(d.del,1);saveS();route()}
else if(d.copy){const t=btxt(S[d.copy].n,S[d.copy].b);try{navigator.clipboard.writeText(t).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать'))}catch(x){toast('Не удалось скопировать')}}return}const t=e.target.closest('[data-pick],[data-add],[data-rm],[data-clear],[data-open]');if(!t)return;const d=t.dataset;
if(d.pick){const x=G[d.pick];B[x.c]=B[x.c]===x.id?undefined:x.id;if(!B[x.c])delete B[x.c];save();route2()}
else if(d.add){const x=G[d.add];B[x.c]=x.id;save();toast(x.n+' добавлен в конфигуратор')}
else if(d.rm){delete B[d.rm];save();route2()}
else if(d.clear!==undefined){B={};save();route2()}
else if(d.open){const x=BUILDS[d.open];B=Object.fromEntries(x.ids.map(i=>[G[i].c,i]));save();location.hash='#/config'}});
function route2(){const y=scrollY;route();scrollTo(0,y)}
addEventListener('hashchange',route);
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('ngpcT',r.dataset.theme)}catch(x){}};try{document.documentElement.dataset.theme=localStorage.getItem('ngpcT')||'dark'}catch(x){}
$('#cu').innerHTML=Object.keys(CURS).map(k=>`<option ${CURS[k]===CUR?'selected':''}>${k}</option>`).join('');$('#cu').onchange=e=>{CUR=CURS[e.target.value];try{localStorage.setItem('ngpcC',e.target.value)}catch(x){}route()};
route();
</script></body></html>
